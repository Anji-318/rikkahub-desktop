name: Release RikkaHub 简体中文版（签名）

on:
  workflow_dispatch:   # 仅手动触发
    inputs:
      tag:
        description: '发布标签（同名自动覆盖旧 Release）'
        required: true
        default: 'v2.4.2-zh'

permissions:
  contents: write      # 允许创建/删除 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 打补丁①——强制默认简体中文
        run: |
          python3 - <<'EOF'
          p = "app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt"
          s = open(p, encoding="utf-8").read()
          s = s.replace(
              "import android.app.Application\n",
              "import android.app.Application\nimport android.content.Context\nimport android.content.res.Configuration\nimport java.util.Locale\n", 1)
          s = s.replace(
              "class RikkaHubApp : Application() {\n    override fun onCreate() {",
              """class RikkaHubApp : Application() {
              // 强制默认简体中文，不跟随系统语言
              override fun attachBaseContext(base: Context) {
                  val locale = Locale.SIMPLIFIED_CHINESE
                  Locale.setDefault(locale)
                  val config = Configuration(base.resources.configuration)
                  config.setLocale(locale)
                  config.setLayoutDirection(locale)
                  super.attachBaseContext(base.createConfigurationContext(config))
              }

              override fun onCreate() {""", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patch applied")
          EOF

      - name: 打补丁②——本地构建用 google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "rikkahub-local-build",
              "storage_bucket": "rikkahub-local-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [ { "current_key": "AIzaSyLocalBuildDummyKey000000000000000" } ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 还原签名 keystore 并写入 local.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore
          cat > local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 安装 web-ui 依赖
        run: |
          cd web-ui
          pnpm install

      - name: 编译 Release APK（签名 + 混淆）
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: 重命名 APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "dist/RikkaHub-zhCN-$(basename $f)"
          done
          ls -la dist/

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-zhCN-release-apk
          path: dist/*.apk

      - name: 删除已存在的同名 Release 和 tag（覆盖发布）
        run: |
          gh release delete "${{ inputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/${{ inputs.tag }}" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 GitHub Release 并附带 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: RikkaHub 简体中文版 ${{ inputs.tag }}
          body: |
            强制简体中文（不跟随系统语言）的 Release 签名版。
            - 基于上游 rikkahub/rikkahub 最新代码构建
            - arm64-v8a + x86_64 + universal
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}