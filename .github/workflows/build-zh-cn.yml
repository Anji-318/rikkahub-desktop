name: Build RikkaHub 简体中文版 APK

on:
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 打补丁①——强制默认简体中文
        run: |
          python3 - <<'EOF'
          import re
          p = "app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt"
          s = open(p, encoding="utf-8").read()
          s = s.replace(
              "import android.app.Application\n",
              "import android.app.Application\nimport android.content.Context\nimport android.content.res.Configuration\nimport java.util.Locale\n", 1)
          s = s.replace(
              "class RikkaHubApp : Application() {\n    override fun onCreate() {",
              """class RikkaHubApp : Application() {
              // 强制默认简体中文，不跟随系统语言
              override fun attachBaseContext(base: Context) {
                  val locale = Locale.SIMPLIFIED_CHINESE
                  Locale.setDefault(locale)
                  val config = Configuration(base.resources.configuration)
                  config.setLocale(locale)
                  config.setLayoutDirection(locale)
                  super.attachBaseContext(base.createConfigurationContext(config))
              }

              override fun onCreate() {""", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patch applied")
          EOF

      - name: 打补丁②——本地构建用 google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "rikkahub-local-build",
              "storage_bucket": "rikkahub-local-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [ { "current_key": "AIzaSyLocalBuildDummyKey000000000000000" } ]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "api_key": [ { "current_key": "AIzaSyLocalBuildDummyKey000000000000000" } ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: 安装 web-ui 依赖
        run: |
          cd web-ui
          pnpm install

      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-zhCN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
