name: Release RikkaHub Desktop（全平台）

on:
  workflow_dispatch:   # 仅手动触发
    inputs:
      tag:
        description: '发布标签（同名自动覆盖旧 Release）'
        required: true
        default: 'v0.6.0-desktop'

permissions:
  contents: write      # 允许创建/删除 Release

jobs:
  build:
    # jpackage 打原生包必须在对应平台的 runner 上
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package-task: packageMsi
            artifact-name: windows-x64
          # macos-latest = Apple Silicon (arm64)；macos-15-intel = Intel (x64)
          # （macos-13 镜像已于 2025-12 退役，Intel 只能用 macos-15-intel）
          - os: macos-latest
            package-task: packageDmg
            artifact-name: macos-arm64
          - os: macos-15-intel
            package-task: packageDmg
            artifact-name: macos-intel
          - os: ubuntu-latest
            package-task: packageDeb
            artifact-name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 统一用 bash（Windows runner 默认 pwsh 无法直接执行无扩展名的 gradlew 脚本）
      - name: 构建桌面版（绿色目录 + 安装包）
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew createDistributable ${{ matrix.package-task }} --no-daemon || {
            echo "::error::构建失败，以下是 jpackage 日志："
            for f in build/compose/logs/*/*.txt; do
              [ -f "$f" ] || continue
              echo "----- $f -----"
              cat "$f"
            done
            exit 1
          }
        env:
          GRADLE_OPTS: "-Xmx4g"

      # 失败时把 jpackage 日志传为 artifact，便于事后排查
      - name: 上传 jpackage 日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-logs-${{ matrix.artifact-name }}
          path: build/compose/logs/
          if-no-files-found: ignore

      - name: 收集产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Compress-Archive -Path build/compose/binaries/main/app/RikkaHub -DestinationPath dist/RikkaHub-desktop-windows-x64.zip
          Copy-Item build/compose/binaries/main/msi/*.msi dist/
          ls dist

      - name: 收集产物（macOS）
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --sequesterRsrc --keepParent build/compose/binaries/main/app/RikkaHub.app "dist/RikkaHub-desktop-${{ matrix.artifact-name }}.zip"
          # dmg 文件名带上架构后缀，避免两个 mac job 产物同名冲突
          for f in build/compose/binaries/main/dmg/*.dmg; do
            base=$(basename "$f" .dmg)
            cp "$f" "dist/${base}-${{ matrix.artifact-name }}.dmg"
          done
          ls -la dist

      - name: 收集产物（Linux）
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf dist/RikkaHub-desktop-linux-x64.tar.gz -C build/compose/binaries/main/app RikkaHub
          cp build/compose/binaries/main/deb/*.deb dist/
          ls -la dist

      - name: 上传到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-desktop-${{ matrix.artifact-name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: RikkaHub-desktop-*
          path: dist
          merge-multiple: true

      - name: 删除已存在的同名 Release 和 tag（覆盖发布）
        run: |
          gh release delete "${{ inputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/${{ inputs.tag }}" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 GitHub Release 并附带全部平台安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: RikkaHub Desktop ${{ inputs.tag }}
          body: |
            RikkaHub 桌面原生客户端（Compose Desktop，Kotlin + Compose Multiplatform）。

            **Windows x64**
            - `RikkaHub-*.msi`：安装包
            - `RikkaHub-desktop-windows-x64.zip`：绿色版，解压后运行 RikkaHub.exe

            **macOS（Apple Silicon / M 系列）**
            - `RikkaHub-*-macos-arm64.dmg`：安装镜像（未签名，首次打开需在「系统设置 → 隐私与安全性」中允许）
            - `RikkaHub-desktop-macos-arm64.zip`：绿色版 .app

            **macOS（Intel）**
            - `RikkaHub-*-macos-intel.dmg`：安装镜像（未签名，同上需允许）
            - `RikkaHub-desktop-macos-intel.zip`：绿色版 .app

            **Linux x64**
            - `RikkaHub-*.deb`：Debian/Ubuntu 安装包
            - `RikkaHub-desktop-linux-x64.tar.gz`：绿色版，解压后运行 bin/RikkaHub
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
